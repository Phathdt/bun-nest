name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare backend config
        run: cp apps/backend/config/config.yml.example apps/backend/config/config.yml

      - name: Generate Prisma client
        run: bun run backend:prisma:generate

      - name: Typecheck
        run: bun run backend:typecheck

      - name: Lint
        run: bun run backend:lint

      - name: Unit tests with coverage
        run: bun run backend:test:unit

      - name: Integration tests
        run: bun run backend:test:integration

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage
          if-no-files-found: warn

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare backend config
        run: cp apps/backend/config/config.yml.example apps/backend/config/config.yml

      - name: Install Playwright browsers
        run: bun run e2e:install:browsers

      - name: Run E2E tests
        run: bun run test:e2e
